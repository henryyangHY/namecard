<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image template — Henry Yang</title>
<meta name="robots" content="noindex" />

<!-- Design tokens + self-hosted fonts come straight from the live stylesheet,
     so this template can never drift from the site's design system. -->
<link rel="stylesheet" href="assets/css/v2.css?v=3.2" />

<style>
  /* ===== Render target: exactly 1200 x 630 ===== */
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden}

  .og{
    position:relative;width:1200px;height:630px;
    background-color:var(--canvas);
    background-image:radial-gradient(var(--hairline-soft) 1px,transparent 1.4px);
    background-size:var(--dot-pitch) var(--dot-pitch);
  }

  /* The card — same 2px ink outline + hard offset shadow as .bio-card */
  .og__card{
    position:absolute;left:44px;top:40px;width:1100px;height:540px;
    display:flex;flex-direction:column;
    border:2px solid var(--ink);border-radius:var(--radius-lg);
    background:var(--surface-card);
    box-shadow:10px 10px 0 var(--ink);
    padding:38px 52px 34px;
  }

  /* ---- rail (mirrors index.html .rail) ---- */
  .og__rail{display:flex;align-items:center;gap:16px}
  .og__brand{display:inline-flex;align-items:center;gap:11px}
  .og__dot{width:16px;height:16px;flex:0 0 16px;background:var(--primary);border:2px solid var(--ink);border-radius:var(--radius-full)}
  .og__mono{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
  .og__rule{flex:1;height:2px;background:var(--ink);opacity:.26}
  .og__tag{font-family:var(--font-mono);font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  /* ---- body ---- */
  .og__body{flex:1;display:flex;align-items:center;gap:52px;min-height:0}
  .og__id{flex:1;min-width:0}
  .og__name{margin:0;font-family:var(--font-display);font-weight:700;font-size:78px;line-height:.98;letter-spacing:-2.6px;color:var(--ink)}
  .og__moniker{margin:16px 0 0;font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1.14;letter-spacing:-.7px;color:var(--ink)}
  .og__tagline{margin:18px 0 0;font-family:var(--font-body);font-weight:400;font-size:20px;line-height:1.5;color:var(--body);max-width:34ch}
  .og__em{color:var(--accent);font-weight:500}

  .og__photo{flex:0 0 250px;width:250px;height:250px}
  .og__photo img{
    width:250px;height:250px;object-fit:cover;object-position:center 16%;
    border:2px solid var(--ink);border-radius:var(--radius-full);
    box-shadow:9px 9px 0 var(--ink);background:var(--canvas-tint);
  }

  /* ---- foot ---- */
  .og__foot{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding-top:20px;border-top:2px solid var(--hairline-soft);
    font-family:var(--font-mono);font-size:14px;letter-spacing:.06em;color:var(--muted);
  }
  .og__url{color:var(--primary);font-weight:500}
  .og__facets{text-transform:uppercase;letter-spacing:.13em;font-size:12.5px}

  /* ===================== story variant ===================== */
  /* Inverted to the .band--ink surface the story page is built on. */
  .og--story .og__card{background:var(--surface-band);border-color:var(--ink);box-shadow:10px 10px 0 var(--primary)}
  .og--story .og__mono{color:var(--canvas)}
  .og--story .og__rule{background:var(--on-band-dim);opacity:.42}
  .og--story .og__tag{color:var(--on-band-dim)}
  .og--story .og__body{align-items:flex-start;flex-direction:column;justify-content:center;gap:0}
  .og--story .og__id{flex:0 1 auto}
  .og--story .og__photo{display:none}
  .og--story .og__kicker{
    display:inline-block;margin:0 0 24px;padding:4px 11px;
    background:var(--primary);color:var(--on-primary);border:2px solid var(--on-band-dim);
    font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  }
  .og--story .og__name{font-size:58px;line-height:1.04;letter-spacing:-1.45px;color:var(--canvas);max-width:17ch}
  .og--story .og__tagline{margin-top:22px;font-size:19px;line-height:1.6;color:var(--on-band);max-width:52ch}
  .og--story .og__em{color:var(--canvas);font-style:italic;font-weight:400}
  .og--story .og__foot{border-top-color:rgba(152,161,179,.38);color:var(--on-band-dim)}
  .og--story .og__url{color:var(--primary-lift)}
</style>
</head>

<body>

<!-- Default: the landing-page card. Add ?p=story for the story-page variant. -->
<div class="og" id="og">
  <div class="og__card">

    <header class="og__rail">
      <span class="og__brand"><span class="og__dot"></span><span class="og__mono">HY</span></span>
      <span class="og__rule"></span>
      <span class="og__tag" id="og-rail-tag">Virtual name card</span>
    </header>

    <div class="og__body">
      <div class="og__id">
        <p class="og__kicker" id="og-kicker" hidden></p>
        <h1 class="og__name" id="og-name">Henry Yang</h1>
        <p class="og__moniker" id="og-moniker">The Builder Who Turns<br>Chaos Into <span class="cb-mark">Calm</span></p>
        <p class="og__tagline" id="og-tagline">I build the systems that gave me my life back, so other people can have <span class="og__em">theirs</span>.</p>
      </div>
      <div class="og__photo"><img src="images/avatar.jpg" alt="" width="250" height="250"></div>
    </div>

    <footer class="og__foot">
      <span class="og__url" id="og-url">henryyanghy.github.io/namecard</span>
      <span class="og__facets" id="og-facets">Builder · Storyteller · Tech Instructor</span>
    </footer>

  </div>
</div>

<script>
  if (new URLSearchParams(location.search).get('p') === 'story') {
    document.getElementById('og').classList.add('og--story');
    document.getElementById('og-rail-tag').textContent = 'The story';
    document.getElementById('og-kicker').hidden = false;
    document.getElementById('og-kicker').textContent = 'Who is Henry';
    document.getElementById('og-name').textContent = 'The thing is — nobody actually likes to work.';
    document.getElementById('og-moniker').remove();
    document.getElementById('og-tagline').innerHTML =
      'I was obsessed with it anyway. Not with the work itself, but with being <span class="og__em">busy</span> at it. This is where it started.';
    document.getElementById('og-url').textContent = 'henryyanghy.github.io/namecard/story.html';
    document.getElementById('og-facets').textContent = 'Origin story';
  }
</script>

</body>
</html>
